<script>
const scriptName = document.getElementById('scriptName');
const scriptCode = document.getElementById('scriptCode');
const copyBtn = document.getElementById('copyBtn');
const toast = document.getElementById('toast');
const scriptItems = document.querySelectorAll('.script-item');
const searchInput = document.getElementById('searchInput');
const scriptCount = document.getElementById('scriptCount');

let currentName = 'Redz Hub';
let currentCode = scriptCode.textContent;

// Search function
searchInput.addEventListener('input', function() {
    const searchText = this.value.toLowerCase().trim();
    let visibleCount = 0;
    
    scriptItems.forEach(item => {
        const name = item.dataset.name.toLowerCase();
        if (name.includes(searchText)) {
            item.classList.remove('hidden');
            visibleCount++;
        } else {
            item.classList.add('hidden');
        }
    });
    
    scriptCount.textContent = visibleCount + ' scripts';
});

// Script item click
scriptItems.forEach(item => {
    item.addEventListener('click', function() {
        scriptItems.forEach(i => i.classList.remove('active'));
        this.classList.add('active');
        
        const name = this.dataset.name;
        const code = this.dataset.code;
        
        scriptName.textContent = name;
        scriptCode.textContent = code;
        
        currentName = name;
        currentCode = code;
        
        showToast('✓ Loaded: ' + name);
    });
});

copyBtn.addEventListener('click', copyScript);

function showToast(msg, color="#00ff88"){
    toast.textContent = msg;
    toast.style.color = color;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => {
        toast.textContent = "";
    }, 2500);
}

async function copyScript(){
    const text = currentCode;
    
    if (!text) {
        showToast('✗ NO SCRIPT FOUND', '#ff5555');
        return;
    }
    
    if(navigator.clipboard && window.isSecureContext){
        try{
            await navigator.clipboard.writeText(text);
            showToast('✓ ' + currentName + ' COPIED');
            return;
        }catch(e){}
    }
    
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.readOnly = true;
    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    
    let success = false;
    try{
        success = document.execCommand("copy");
    }catch(e){}
    textarea.remove();
    
    if(success){
        showToast('✓ ' + currentName + ' COPIED');
    }else{
        showToast('✗ COPY FAILED', '#ff5555');
    }
}

document.addEventListener("touchstart", function(){}, {passive: true});
</script>
